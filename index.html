<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suki Mini POS</title>
<style>
  :root {
    --red: #d9362b;
    --red-dark: #b82a21;
    --red-soft: #fdecea;
    --ink: #1f2933;
    --muted: #6b7785;
    --line: #e6e9ee;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: "Noto Sans Thai", "Sarabun", "Leelawadee UI", Tahoma, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; }

  /* หัวเว็บ */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border-radius: 18px;
    color: #ffffff;
    background: linear-gradient(135deg, #e8473b 0%, #c42b21 100%);
    box-shadow: 0 6px 18px rgba(217, 54, 43, 0.25);
  }
  .brand-icon {
    font-size: 34px;
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 16px;
  }
  .brand h1 { margin: 0; font-size: 26px; line-height: 1.2; }
  .brand p { margin: 2px 0 0; font-size: 15px; opacity: 0.92; }

  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    margin: 28px 0 12px;
  }
  h2::before {
    content: "";
    width: 5px;
    height: 22px;
    border-radius: 3px;
    background: var(--red);
  }

  /* เมนู */
  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(31, 41, 51, 0.05);
  }
  .menu-emoji {
    font-size: 30px;
    width: 56px;
    height: 56px;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--red-soft);
    border-radius: 14px;
  }
  .menu-info { flex: 1; min-width: 0; }
  .menu-name { font-weight: 700; font-size: 19px; }
  .menu-price { color: var(--red); font-weight: 700; }

  button {
    font-family: inherit;
    font-size: 17px;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  .btn-add {
    background: var(--red);
    color: #ffffff;
    font-weight: 700;
    padding: 10px 18px;
    min-height: 44px;
  }
  .btn-add:hover { background: var(--red-dark); }

  /* ตะกร้า */
  .cart-box {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 6px 14px;
    background: var(--card);
    box-shadow: 0 2px 8px rgba(31, 41, 51, 0.05);
  }
  .cart-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
  }
  .cart-row:last-child { border-bottom: 0; }
  .cart-name { display: flex; align-items: center; gap: 10px; }
  .qty {
    min-width: 34px;
    padding: 2px 8px;
    text-align: center;
    font-weight: 700;
    font-size: 16px;
    color: var(--red);
    background: var(--red-soft);
    border-radius: 999px;
  }
  .cart-price { font-weight: 700; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; }

  /* ยอดรวม */
  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding: 16px 18px;
    background: var(--red-soft);
    border-radius: 16px;
    font-weight: 700;
  }
  .total-label { font-size: 20px; }
  .total-amount { font-size: 30px; color: var(--red-dark); }
  .total-amount.pulse { animation: pulse 0.25s ease; }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .btn-clear {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    min-height: 48px;
    background: #ffffff;
    color: var(--red-dark);
    font-weight: 700;
    border: 2px solid var(--red);
  }
  .btn-clear:hover { background: var(--red-soft); }
</style>
</head>
<body>
<main>
  <header class="brand">
    <div class="brand-icon">🍲</div>
    <div>
      <h1>Suki Mini POS</h1>
      <p>ระบบรับออร์เดอร์ร้านสุกี้</p>
    </div>
  </header>

  <h2>เมนู</h2>
  <div id="menu"></div>

  <h2>ตะกร้า</h2>
  <div class="cart-box" id="cart"></div>
  <div class="total">
    <span class="total-label">ยอดรวม</span>
    <span class="total-amount" id="total-wrap"><span id="total">0</span> บาท</span>
  </div>
  <button class="btn-clear" id="clear-btn" type="button">🗑️ ล้างตะกร้า</button>
</main>

<script>
  var MENU = [
    { id: "pork", name: "ชุดหมู", price: 199, icon: "🐖" },
    { id: "beef", name: "ชุดเนื้อ", price: 249, icon: "🥩" },
    { id: "water", name: "น้ำดื่ม", price: 20, icon: "💧" }
  ];

  var cart = {}; // id -> จำนวน

  function renderMenu() {
    var html = "";
    MENU.forEach(function (item) {
      html +=
        '<div class="menu-item">' +
          '<div class="menu-emoji">' + item.icon + '</div>' +
          '<div class="menu-info"><div class="menu-name">' + item.name + '</div>' +
          '<div class="menu-price">' + item.price + ' บาท</div></div>' +
          '<button class="btn-add" type="button" data-id="' + item.id + '">+ เพิ่ม</button>' +
        '</div>';
    });
    document.getElementById("menu").innerHTML = html;
  }

  function getTotal() {
    var sum = 0;
    MENU.forEach(function (item) {
      sum += item.price * (cart[item.id] || 0);
    });
    return sum;
  }

  function renderCart() {
    var html = "";
    MENU.forEach(function (item) {
      var qty = cart[item.id] || 0;
      if (qty > 0) {
        html +=
          '<div class="cart-row">' +
            '<span class="cart-name">' + item.icon + ' ' + item.name +
            ' <span class="qty">× ' + qty + '</span></span>' +
            '<span class="cart-price">' + (item.price * qty) + ' บาท</span>' +
          '</div>';
      }
    });
    if (html === "") html = '<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>';
    document.getElementById("cart").innerHTML = html;
    document.getElementById("total").textContent = getTotal();
    pulseTotal();
  }

  function pulseTotal() {
    var el = document.getElementById("total-wrap");
    if (!el.classList) return;
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    renderCart();
  }

  function clearCart() {
    cart = {};
    renderCart();
  }

  document.getElementById("menu").addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-id]") : e.target;
    var id = btn && btn.getAttribute("data-id");
    if (id) addToCart(id);
  });
  document.getElementById("clear-btn").addEventListener("click", clearCart);

  renderMenu();
  renderCart();
</script>
</body>
</html>
